[project]
name = "scrumbot"
version = "0.1.0"
description = "Bot scrum master: giao PIC cho đơn trống và lập sổ rủi ro sprint"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.scripts]
scrumbot = "scrumbot.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrumbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ai: calls a real AI CLI; runs only when ASSIGNTOOL_TEST_AI names a tool (gemini or agy)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
# Markdown is prose: ruff would rewrap the Python examples in docs/ (seen with ruff 0.16).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
