[project]
name = "assigntool"
version = "0.1.0"
description = "Đề xuất dev phụ trách (PIC) cho từng đơn đầu sprint"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.scripts]
assigntool = "assigntool.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assigntool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_input: acceptance test on input/ (spec §12); skipped when the sample is absent",
    "ai: calls a real AI CLI; runs only when ASSIGNTOOL_TEST_AI names a tool (gemini or agy)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
